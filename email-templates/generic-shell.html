<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#F4F4F2;font-family:'Inter',system-ui,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F4F2;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF;border:1px solid #E6E6E1;border-radius:16px;overflow:hidden;">

          <!-- Header — matches the app's PageHero band -->
          <tr>
            <td style="background-color:#FEFDF4;background-image:radial-gradient(circle at 50% 0%,rgba(245,197,24,0.16),transparent 65%);padding:36px 40px 28px;text-align:center;border-bottom:1px solid #E6E6E1;">
              <p style="margin:0;color:#F5C518;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:4px;font-family:'Inter',system-ui,sans-serif;">{{eyebrow}}</p>
              <h1 style="margin:8px 0 0;color:#1C1C1E;font-size:30px;font-weight:600;font-family:'Playfair Display',Georgia,serif;">HotelEase</h1>
              <p style="margin:6px 0 0;color:#6B7280;font-size:13px;font-family:'Inter',system-ui,sans-serif;">Property Management System &middot; Consolatrix Suites, Toledo City</p>
            </td>
          </tr>

          <!-- Body (dynamic content injected here) -->
          <tr>
            <td style="padding:32px 40px;font-family:'Inter',system-ui,sans-serif;">
              <p style="margin:0 0 20px;color:#54545A;font-size:15px;line-height:1.6;">Hi <strong style="color:#1C1C1E;">{{to_name}}</strong>,</p>

              {{{bodyHTML}}}

              <p style="margin:24px 0 0;color:#54545A;font-size:14px;line-height:1.6;">If you have any questions, feel free to reach out anytime.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#FAFAF8;padding:24px 40px;text-align:center;border-top:1px solid #E6E6E1;font-family:'Inter',system-ui,sans-serif;">
              <p style="margin:0 0 4px;color:#6B7280;font-size:12px;">HotelEase &middot; Consolatrix Suites, Toledo City</p>
              <p style="margin:0;color:#A1A1AA;font-size:11px;">This is an automated email from our system.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
