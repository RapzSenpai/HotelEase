name = "hotelease-chat"
main = "src/index.js"
compatibility_date = "2026-01-01"

# AI abuse protection tiers (see src/index.js):
#   minute caps — anonymous vs signed-in users; daily budget in KV below.
#   Defaults live in src/index.js; these commented vars show the same values.
# [vars]
# RATE_LIMIT_ANON_MAX = "3"    # per minute, keyed by IP
# RATE_LIMIT_USER_MAX = "20"   # per minute, keyed by uid
# DAILY_ANON_MAX      = "5"    # per day, keyed by IP
# DAILY_USER_MAX      = "100"  # per day, keyed by uid
#
# AI_LIMITS KV (below) is required for GLOBAL daily caps. Without the binding
# the worker falls back to per-isolate memory and the daily cap is bypassable.

[[kv_namespaces]]
binding = "AI_LIMITS"
id = "bcd303296228470a8c99654377e3611e"

# Hourly stale-hold sweep: cancels abandoned Awaiting Payment bookings past
# their 48h deadline and frees their room_availability markers (see scheduled
# handler in src/index.js). Needs the FIREBASE_SERVICE_ACCOUNT secret.
[triggers]
crons = ["0 * * * *"]

# Set secrets securely (never in code / git):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT
