name = "hotelease-chat"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Rate limiting guard: max requests per client IP per 60s window.
[vars]
RATE_LIMIT_MAX = "10"

# Set secrets securely (never in code / git):
